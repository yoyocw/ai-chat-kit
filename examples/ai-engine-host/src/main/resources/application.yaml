# 样例仅监听本机随机端口，不加载任何业务服务的环境配置。
server:
  address: 127.0.0.1
  port: 0

# 本样例不创建宿主全局数据源；AI 连接由下方 storage.jdbc 独立管理。
# 数据库结构由部署流程显式维护，应用启动不执行初始化 SQL。
spring:
  sql:
    init:
      mode: never

ai-chat-kit:
  ai:
    engine:
      # @EnableAiChatKit 与此开关共同启用 Starter 门面及完整性检查。
      # 普通宿主必须同时保留启用注解和总开关；缺少任一项都不装配 AI 运行资源。
      # 开启前必须提供真实宿主身份、会话、权限及所选模式的适配；缺失时拒绝启动。
      # 关闭时 /host/engine 仅返回装配诊断，/host/health 仅表示宿主存活。
      # 不提供假用户、共享身份或内存事务替代，诊断不作为完整业务验收。
      enabled: ${AI_ENGINE_ENABLED:false}
    web:
      # 可选独立 HTTP 适配；开启前须引入 adapter-web、保留启用注解并开启引擎。
      # 身份由真实宿主适配捕获，不接受请求参数中的用户编号作为认证依据。
      enabled: ${AI_WEB_ENABLED:false}
      # 模块自带完整路径前缀，不依赖林业 Web 框架自动添加 /admin-api。
      # 与林业旧 server/MyBatis 入口共存时使用独立前缀，避免静默接管旧路由。
      path-prefix: /admin-api/ai-component
    starter:
      # 固定宿主部署边界；身份适配返回的 namespace 必须与此值一致。
      namespace: ai-engine-host-example
      # 明确本样例的目标能力；单聊、群聊及可选 MCP 的实际调用需分别验收。
      modes: [SINGLE, GROUP]
    storage:
      # PostgreSQL 初始化资源需审核后手工执行，应用不会自动建表或迁移旧数据。
      type: postgresql
      jdbc:
        # AI 自有连接池及事务管理器，不参与宿主默认数据源/事务管理器选择。
        # 引擎关闭时不创建资源；启用前通过部署环境提供真实连接信息。
        mode: isolated
        jdbc-url: ${AI_DB_URL:}
        username: ${AI_DB_USERNAME:}
        password: ${AI_DB_PASSWORD:}
        maximum-pool-size: 5
        connection-timeout-ms: 5000
        validation-timeout-ms: 1000
    execution:
      # 样例使用固定 Hikari 数据源及内置 JDBC/纯聊天适配，SQL 显式携带身份范围。
      # 此模式不恢复登录 ThreadLocal；宿主若依赖线程身份或动态路由，应提供自定义 scope。
      # 状态读使用独立只读事务；事务超时不等于连接获取及网络请求的端到端截止时间。
      scope: jdbc-explicit
    mcp-jwt-v1:
      # 普通应用授权与 JWT 签发分开；两者仍都要求 @EnableAiChatKit 与 engine.enabled=true。
      # 无工具聊天只开启 authorization-enabled，不需要伪装开启签发或配置密钥。
      authorization-enabled: ${AI_MCP_AUTHORIZATION_ENABLED:false}
      # signing-enabled 保留旧配置兼容；带工具时才开启并补齐主体映射、签名和信任材料。
      signing-enabled: ${AI_MCP_SIGNING_ENABLED:false}
      # 资源验签是独立资源服务能力，不受聊天引擎激活标记控制。
      verification-enabled: ${AI_MCP_VERIFICATION_ENABLED:false}
      # 按所选应用添加策略；app-id/mcp-id/tool-ids 必须与下方 applications 完全对应。
      # 同一 app-id 只配置一次；permission 是宿主实际校验的权限码，不是角色名称。
      # 无工具时 tool-ids/endpoint-codes 均为 []，不需要数值映射、issuer/audience 或密钥。
      # apps:
      #   - app-id: ${AI_SINGLE_APP_ID}
      #     permission: ${AI_SINGLE_APP_PERMISSION}
      #     mcp-id: ${AI_SINGLE_MCP_ID:}
      #     tool-ids: ${AI_SINGLE_USER_AUTH_TOOL_IDS:}
      #     endpoint-codes: ${AI_SINGLE_ENDPOINT_CODES:}
      #     max-page-size: 50
      # 有工具时才补固定信任配置及真实数值身份映射；密钥只通过部署秘密提供。
      # 所选密钥入口启用时会尝试创建配置密钥源，并要求配套 issuer/audience；实际公钥解析由使用路径执行，不要填空占位。
      # issuer: ${AI_MCP_ISSUER}
      # audience: ${AI_MCP_AUDIENCE}
      # keys:
      #   public-key: ${AI_MCP_PUBLIC_KEY}
      #   private-key: ${AI_MCP_PRIVATE_KEY}
      # 资源侧启用 verification 时另配 endpoints；只需公钥和真实会话/权限/数值映射适配。
      # endpoint-code 必须由资源路由固定选择，并继续执行资源自身的数据权限检查。
      # endpoints:
      #   - endpoint-code: ${AI_MCP_ENDPOINT_CODE}
      #     permission: ${AI_MCP_ENDPOINT_PERMISSION}
      #     pageable: true
      #     max-page-size: 50
    # 当前林业宿主选择 host-platform 依赖后可直接使用以下内置接线，无需实现 AI Port。
    # 此模式的 namespace 必须是 platform；每个允许租户使用自己的受限消费者配置。
    # platform-host:
    #   mode: ordinary-bearer
    #   inspections:
    #     - tenant-id: ${AI_TENANT_ID}
    #       base-url: ${AI_AUTH_BASE_URL}
    #       consumer-access-token: ${AI_INSPECTION_TOKEN}
    # 多租户继续增加列表项；不得跨租户复用 token。旧 session-inspection 配置仅供 legacy 固定租户链路。
    # 开启 Web 适配并接入宿主公开分享页面后，配置实际 HTTP(S) 页面基址。
    # 宿主安全配置仍需明确分享读取入口的匿名访问范围。
    # 不含用户凭据、查询参数或片段，分享服务会在基址后追加随机分享码。
    # chat:
    #   share-base-url: ${AI_SINGLE_SHARE_BASE_URL:}
    #   group-share-base-url: ${AI_GROUP_SHARE_BASE_URL:}
    # 群聊需配置与实际百炼工作流一致的成员目录；以下仅说明字段，不会自动启用成员。
    # code 使用唯一的大写编码，不得使用编排器保留码 ORCHESTRATOR。
    # 选中的成员必须已启用；name/role 应由部署者填写真实名称和职责。
    # group:
    #   agents:
    #     - code: PLANNER
    #       name: 规划助手
    #       role: 按实际工作流填写规划职责
    #       enabled: true
    #     - code: REVIEWER
    #       name: 审核助手
    #       role: 按实际工作流填写审核职责
    #       enabled: true
    bailian:
      api-key: ${DASHSCOPE_API_KEY:}
      # 监测必须配合宿主的可信状态查询适配；样例默认关闭。
      generation-watch-enabled: false
    applications:
      # 配置端口已装配不代表以下值有效；按模式在实际使用时校验，不回退到配置数据库。
      # 只通过环境变量提供真实配置，本样例的状态接口不会读取或展示这些值。
      single:
        app-id: ${AI_SINGLE_APP_ID:}
        mcp-id: ${AI_SINGLE_MCP_ID:}
        user-auth-tool-ids: ${AI_SINGLE_USER_AUTH_TOOL_IDS:}
      group:
        app-id: ${AI_GROUP_APP_ID:}
        user-auth-tool-ids: ${AI_GROUP_USER_AUTH_TOOL_IDS:}
